[workspace]
members = [
    "crates/contextgc-engine",
    "crates/contextgc-memory",
    "crates/contextgc-tokenizer",
    "crates/contextgc-policy",
    "crates/contextgc-store",
    "crates/contextgc-cli",
    "crates/contextgc-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/contextgc/contextgc"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.25", features = ["v4", "serde"] }
regex = "1.10"
unicode-segmentation = "1.12"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "io-std", "io-util", "macros"] }
rusqlite = { version = "0.34", features = ["bundled", "chrono", "uuid"] }
